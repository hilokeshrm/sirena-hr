<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply leave</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6B63}a:hover{color:#08524C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5F7; font-family: 'Plus Jakarta Sans', sans-serif; color: #161A22; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 24px 12px 8px; flex-shrink: 0">
    <a href="Leave.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #161A22; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800">Apply leave</h1>
  </header>

  <form style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 16px; overflow: hidden">
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 700; color: #3B4250; padding: 0; margin-bottom: 8px">Leave type</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">
            <span style="font-size: 14px; font-weight: 700">{{t.label}}</span>
            <span style="font-size: 12px; color: #5B6472">{{t.left}}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="from" style="font-size: 13px; font-weight: 700; color: #3B4250">From</label>
        <input id="from" type="text" value="Mon, 26 Oct" style="height: 48px; border: 1px solid #C9CED6; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; background: #FFFFFF; box-sizing: border-box">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="to" style="font-size: 13px; font-weight: 700; color: #3B4250">To</label>
        <input id="to" type="text" value="Wed, 28 Oct" style="height: 48px; border: 1px solid #C9CED6; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; background: #FFFFFF; box-sizing: border-box">
      </div>
    </div>

    <label style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 0 14px; min-height: 52px; font-size: 14px; font-weight: 600">
      Half day
      <input type="checkbox" checked="{{half}}" onChange="{{toggleHalf}}" style="width: 22px; height: 22px; accent-color: #0B6B63; margin: 0">
    </label>
    <sc-if value="{{half}}" hint-placeholder-val="{{ false }}">
      <div role="radiogroup" aria-label="Half" style="display: flex; gap: 8px; margin-top: -6px">
        <button type="button" role="radio" aria-checked="true" style="flex: 1; height: 44px; border-radius: 10px; border: 2px solid #0B6B63; background: #E3F1EF; font: inherit; font-size: 13px; font-weight: 700; color: #0B6B63">First half</button>
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #3B4250">Second half</button>
      </div>
    </sc-if>

    <div style="display: flex; gap: 12px; align-items: flex-start; background: #E3F1EF; border-radius: 12px; padding: 12px 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6B63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.5"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #1F3B38">
        <strong style="font-size: 14px">{{summary}}</strong>
        <span>Balance after: {{after}} · No holidays in range</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="reason" style="font-size: 13px; font-weight: 700; color: #3B4250">Reason</label>
      <textarea id="reason" rows="3" style="border: 1px solid #C9CED6; border-radius: 12px; padding: 12px; font: inherit; font-size: 14px; resize: none; background: #FFFFFF">Family function in Madurai</textarea>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 48px; border: 1px dashed #A3AAB6; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 600; color: #3B4250">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7-7L13 4.4a3.3 3.3 0 0 1 4.7 4.7l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5"></path></svg>
      Attach document (optional)
    </button>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; color: #5B6472; text-align: center">Goes to <strong style="color: #161A22">Arjun Mehta</strong> (manager), then HR</div>
      <a href="LeaveDetail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #0B6B63; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">Submit request</a>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'EL', half: false };
  }
  renderVals() {
    const defs = [
      { id: 'CL', label: 'Casual', left: '8 days left', bal: 8 },
      { id: 'SL', label: 'Sick', left: '10 days left', bal: 10 },
      { id: 'EL', label: 'Earned', left: '14.5 days left', bal: 14.5 },
      { id: 'CO', label: 'Comp-off', left: '1 day left', bal: 1 }
    ];
    const base = 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 60px; padding: 10px 12px; border-radius: 12px; font: inherit; color: #161A22; text-align: left; box-sizing: border-box; ';
    const days = this.state.half ? 0.5 : 3;
    const cur = defs.find((d) => d.id === this.state.type);
    return {
      types: defs.map((d) => {
        const on = d.id === this.state.type;
        return {
          ...d,
          pressed: on ? 'true' : 'false',
          style: base + (on ? 'border: 2px solid #0B6B63; background: #E3F1EF;' : 'border: 1px solid #C9CED6; background: #FFFFFF;'),
          pick: () => this.setState({ type: d.id })
        };
      }),
      half: this.state.half,
      toggleHalf: () => this.setState({ half: !this.state.half }),
      summary: days === 0.5 ? '0.5 working day' : '3 working days',
      after: Math.max(cur.bal - days, 0) + ' days ' + cur.label.toLowerCase()
    };
  }
}
</script>
</body>
</html>
