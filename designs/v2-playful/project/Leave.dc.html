<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My leave</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A32330}a:hover{color:#CC4C5C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F5; font-family: 'Plus Jakarta Sans', sans-serif; color: #2A2A2A; overflow: hidden">
  <header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 26px 20px 14px; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 13px; color: #717373; font-weight: 600">Leave year 2026</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">My leave</h1>
    </div>
    <a href="ApplyLeave.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; background: #A32330; color: #FFFFFF; font-weight: 800; font-size: 14px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Apply</a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px 100px; overflow: hidden">
    <section aria-label="Balances" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FDEDF0; border-radius: 22px; padding: 12px; display: flex; align-items: center; gap: 10px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(#A32330 0 67%, #FAC9D2 67% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><div style="width: 38px; height: 38px; border-radius: 50%; background: #FDEDF0; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800">8</div></div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800">Casual</span><span style="font-size: 12px; color: #2A2A2A">of 12 left</span></div>
      </div>
      <div style="background: #FDEDF0; border-radius: 22px; padding: 12px; display: flex; align-items: center; gap: 10px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(#CC4C5C 0 83%, #FAC9D2 83% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><div style="width: 38px; height: 38px; border-radius: 50%; background: #FDEDF0; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800">10</div></div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800">Sick</span><span style="font-size: 12px; color: #2A2A2A">of 12 left</span></div>
      </div>
      <div style="background: #F5F5F5; border-radius: 22px; padding: 12px; display: flex; align-items: center; gap: 10px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(#717373 0 80%, #E7E8E9 80% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><div style="width: 38px; height: 38px; border-radius: 50%; background: #F5F5F5; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 800">14.5</div></div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800">Earned</span><span style="font-size: 12px; color: #2A2A2A">of 18 left</span></div>
      </div>
      <div style="background: #F5F5F5; border-radius: 22px; padding: 12px; display: flex; align-items: center; gap: 10px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(#717373 0 100%, #E7E8E9 100% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><div style="width: 38px; height: 38px; border-radius: 50%; background: #F5F5F5; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800">1</div></div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800">Comp-off</span><span style="font-size: 12px; color: #2A2A2A">expires 30 Nov</span></div>
      </div>
    </section>

    <div role="tablist" aria-label="Filter requests" style="display: flex; gap: 6px; background: #E7E8E9; border-radius: 999px; padding: 4px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{f.sel}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <section aria-label="Requests" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{reqs}}" as="r" hint-placeholder-count="4">
        <a href="LeaveDetail.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 10px 14px 10px 10px; text-decoration: none; color: #2A2A2A; box-shadow: 0 6px 18px rgba(42,42,42,0.05)">
          <span style="{{r.dateStyle}}">
            <span style="font-size: 10px; font-weight: 800; letter-spacing: 0.5px">{{r.mon}}</span>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; line-height: 1">{{r.day}}</span>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 14px; font-weight: 800">{{r.title}}</span>
            <span style="font-size: 12px; color: #717373">{{r.range}}</span>
          </span>
          <span style="{{r.chip}}">{{r.status}}</span>
        </a>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
        <div style="background: #FFFFFF; border-radius: 22px; padding: 22px; text-align: center; font-size: 14px; color: #717373">Nothing here yet.</div>
      </sc-if>
    </section>
  </main>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; height: 68px; background: #2A2A2A; border-radius: 26px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; box-shadow: 0 12px 30px rgba(42,42,42,0.30)">
    <a href="Main.dc.html" aria-label="Home" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #BBBDBF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="Leave.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: 999px; background: #F3879C; color: #2A2A2A; font-size: 13px; font-weight: 800; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>Leave</a>
    <a href="Attendance.dc.html" aria-label="Check in" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #BBBDBF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></a>
    <a href="FoodBooking.dc.html" aria-label="Food" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #BBBDBF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1-3 3.5-3 7h3v11"></path></svg></a>
    <a href="Profile.dc.html" aria-label="Me" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #BBBDBF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'All' };
  }
  renderVals() {
    const all = [
      { mon: 'OCT', day: '26', title: 'Earned · 3 days', range: 'Mon 26 – Wed 28 Oct', status: 'Pending', bg: '#F5F5F5', fg: '#2A2A2A' },
      { mon: 'SEP', day: '18', title: 'Casual · ½ day', range: 'Fri 18 Sep · afternoon', status: 'Approved', bg: '#FDEDF0', fg: '#A32330' },
      { mon: 'SEP', day: '03', title: 'Sick · 2 days', range: 'Thu 3 – Fri 4 Sep', status: 'Approved', bg: '#FDEDF0', fg: '#A32330' },
      { mon: 'AUG', day: '10', title: 'Casual · 1 day', range: 'Mon 10 Aug', status: 'Rejected', bg: '#FDEDF0', fg: '#A32330' }
    ];
    const chips = { Pending: 'color: #A32330; background: #FDEDF0;', Approved: 'color: #FFFFFF; background: #2A2A2A;', Rejected: 'color: #A32330; background: #FAC9D2;' };
    const f = this.state.f;
    const reqs = all.filter((r) => f === 'All' || r.status === f).map((r) => ({
      ...r,
      chip: 'font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; ' + chips[r.status],
      dateStyle: 'width: 52px; height: 56px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0; background: ' + r.bg + '; color: ' + r.fg + ';'
    }));
    return {
      filters: ['All', 'Pending', 'Approved', 'Rejected'].map((o) => ({
        label: o,
        sel: o === f ? 'true' : 'false',
        pick: () => this.setState({ f: o }),
        style: 'flex: 1; height: 38px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; ' + (o === f ? 'background: #2A2A2A; color: #FFFFFF; font-weight: 800;' : 'background: transparent; color: #2A2A2A; font-weight: 700;')
      })),
      reqs,
      none: reqs.length === 0
    };
  }
}
</script>
</body>
</html>
