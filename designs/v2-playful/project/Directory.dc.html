<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team directory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A32330}a:hover{color:#CC4C5C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F5; font-family: 'Plus Jakarta Sans', sans-serif; color: #2A2A2A; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 10px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2A2A2A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; flex: 1">The crew</h1>
      <span style="font-size: 13px; font-weight: 800; background: #FFFFFF; padding: 8px 12px; border-radius: 999px">48 people</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 50px; background: #FFFFFF; border-radius: 18px; padding: 0 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#717373" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="dq" style="position: absolute; left: -9999px">Search people</label>
      <input id="dq" type="search" value="{{q}}" onInput="{{onQ}}" placeholder="Name, role or team" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 14px; background: transparent">
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 6px 20px 20px; overflow: hidden">
    <section aria-label="Where everyone is today" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #A32330; color: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; line-height: 1">29</span><span style="font-size: 12px; font-weight: 700; color: #FAC9D2">in office</span></div>
      <div style="background: #BBBDBF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; line-height: 1">15</span><span style="font-size: 12px; font-weight: 700; color: #2A2A2A">working remote</span></div>
      <div style="background: #E75562; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; line-height: 1">4</span><span style="font-size: 12px; font-weight: 700; color: #2A2A2A">on leave</span></div>
    </section>
    <h2 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">My team</h2>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
        <a href="Profile.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 20px; padding: 8px 12px 8px 8px; text-decoration: none; color: #2A2A2A">
          <span style="{{p.avatar}}">{{p.initials}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 800">{{p.name}}</span><span style="font-size: 12px; color: #717373">{{p.role}}</span></span>
          <span style="{{p.chip}}">{{p.status}}</span>
        </a>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 20px; font-size: 14px; color: #717373; text-align: center">No one matches “{{q}}”.</div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '' };
  }
  renderVals() {
    const all = [
      { initials: 'AM', av: '#BBBDBF', name: 'Arjun Mehta', role: 'Engineering Manager', st: 'office' },
      { initials: 'KS', av: '#BBBDBF', name: 'Karthik S', role: 'Senior Engineer', st: 'office' },
      { initials: 'DN', av: '#E75562', name: 'Divya Nair', role: 'QA Engineer', st: 'remote' },
      { initials: 'RV', av: '#BBBDBF', name: 'Rahul Verma', role: 'Product Designer', st: 'remote' },
      { initials: 'SI', av: '#F3879C', name: 'Sneha Iyer', role: 'Backend Engineer', st: 'leave' },
      { initials: 'VR', av: '#FAC9D2', name: 'Vikram Rao', role: 'Mobile Engineer', st: 'leave' }
    ];
    const chips = {
      office: ['In office', 'color: #A32330; background: #FDEDF0;'],
      remote: ['Remote', 'color: #2A2A2A; background: #F5F5F5;'],
      leave: ['On leave', 'color: #A32330; background: #FDEDF0;']
    };
    const q = this.state.q.trim().toLowerCase();
    const people = all.filter((p) => !q || (p.name + ' ' + p.role).toLowerCase().includes(q)).map((p) => ({
      ...p,
      avatar: 'width: 46px; height: 46px; border-radius: 16px; background: ' + p.av + '; color: #2A2A2A; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0;',
      status: chips[p.st][0],
      chip: 'font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; white-space: nowrap; ' + chips[p.st][1]
    }));
    return { q: this.state.q, onQ: (e) => this.setState({ q: e.target.value }), people, none: people.length === 0 };
  }
}
</script>
</body>
</html>
