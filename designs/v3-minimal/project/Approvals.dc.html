<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A32330}a:hover{color:#A32330}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2A2A2A; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; padding: 22px 16px 10px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2A2A2A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; flex: 1">Team requests</h1>
    <span style="min-width: 32px; height: 32px; padding: 0 10px; border-radius: 999px; background: #EDEDED; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{pendingCount}}</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 20px; overflow: hidden">
    <sc-for list="{{reqs}}" as="r" hint-placeholder-count="3">
      <article style="position: relative; background: #FFFFFF; border: 1px solid #EDEDED; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 18px rgba(42,42,42,0.05); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="{{r.avatar}}">{{r.initials}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 800">{{r.name}}</span>
            <span style="font-size: 12px; color: #2A2A2A">{{r.role}}</span>
          </span>
          <span style="{{r.typeChip}}">{{r.type}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">{{r.dates}}</span>
          <span style="font-size: 13px; font-weight: 700; color: #2A2A2A">· {{r.days}}</span>
        </div>
        <div style="position: relative; background: #EDEDED; border-radius: 4px 18px 18px 18px; padding: 10px 12px; font-size: 13px; color: #2A2A2A">“{{r.reason}}”</div>
        <span style="font-size: 12px; color: #2A2A2A">{{r.meta}}</span>
        <sc-if value="{{r.open}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; gap: 10px">
            <button type="button" onClick="{{r.reject}}" style="flex: 1; height: 48px; border-radius: 16px; border: 0; background: #EDEDED; font: inherit; font-size: 14px; font-weight: 800; color: #A32330">Not this time</button>
            <button type="button" onClick="{{r.approve}}" style="flex: 1; height: 48px; border-radius: 16px; border: 0; background: #EDEDED; font: inherit; font-size: 14px; font-weight: 800; color: #2A2A2A">Approve</button>
          </div>
        </sc-if>
        <sc-if value="{{r.closed}}" hint-placeholder-val="{{ false }}">
          <span style="{{r.stamp}}">{{r.statusLabel}}</span>
        </sc-if>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: {} };
  }
  renderVals() {
    const list = [
      { id: 1, initials: 'KS', av: '#EDEDED', name: 'Karthik S', role: 'Senior Engineer · Atlas', type: 'Casual', tbg: '#EDEDED', tfg: '#A32330', days: '1 day', dates: 'Fri, 9 Oct', reason: 'Bank work in the morning', meta: '5 CL left after · nobody else off that day' },
      { id: 2, initials: 'DN', av: '#EDEDED', name: 'Divya Nair', role: 'QA Engineer · Atlas', type: 'Earned', tbg: '#EDEDED', tfg: '#2A2A2A', days: '5 days', dates: '2–6 Nov', reason: 'Going home for Diwali', meta: '9 EL left after · overlaps with 1 teammate' }
    ];
    const st = this.state.status;
    return {
      pendingCount: list.filter((r) => !st[r.id]).length,
      reqs: list.map((r) => {
        const s = st[r.id];
        return {
          ...r,
          open: !s,
          closed: !!s,
          statusLabel: s === 'ok' ? 'APPROVED' : 'DECLINED',
          stamp: 'position: absolute; right: 18px; bottom: 22px; font-family: \'Bricolage Grotesque\', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 2px; padding: 4px 12px; border-radius: 10px; border: 3px solid ' + (s === 'ok' ? '#2A2A2A; color: #2A2A2A;' : '#A32330; color: #A32330;'),
          avatar: 'width: 46px; height: 46px; border-radius: 16px; background: ' + r.av + '; color: #2A2A2A; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0;',
          typeChip: 'font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; background: ' + r.tbg + '; color: ' + r.tfg + ';',
          approve: () => this.setState({ status: { ...st, [r.id]: 'ok' } }),
          reject: () => this.setState({ status: { ...st, [r.id]: 'no' } })
        };
      })
    };
  }
}
</script>
</body>
</html>
