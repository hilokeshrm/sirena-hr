<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Policies</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A32330}a:hover{color:#A32330}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2A2A2A; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 10px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2A2A2A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">The rulebook</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 50px; background: #FFFFFF; border: 1px solid #EDEDED; border-radius: 18px; padding: 0 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="q" style="position: absolute; left: -9999px">Search policies</label>
      <input id="q" type="search" placeholder="Search “notice period”, “WFH”…" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 14px; background: transparent">
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 6px 20px 20px; overflow: hidden">
    <a href="PolicyDetail.dc.html" style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; background: #EDEDED; border-radius: 26px; padding: 18px; text-decoration: none; color: #2A2A2A">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.5px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #A32330"></span>NEEDS YOUR OK · DUE 14 OCT</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1">Work From Home Policy v3</span>
      <span style="font-size: 13px; color: #2A2A2A">WFH goes from 2 to 3 days a week. 4 min read.</span>
    </a>
    <sc-for list="{{items}}" as="p" hint-placeholder-count="5">
      <a href="PolicyDetail.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #EDEDED; border-radius: 20px; padding: 12px 14px; text-decoration: none; color: #2A2A2A">
        <span style="{{p.icon}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 800">{{p.title}}</span><span style="font-size: 12px; color: #2A2A2A">{{p.meta}}</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Read"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </a>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'All' };
  }
  renderVals() {
    const tone = { Leave: ['#EDEDED', '#A32330'], Work: ['#EDEDED', '#2A2A2A'], Conduct: ['#EDEDED', '#A32330'], Money: ['#EDEDED', '#2A2A2A'] };
    const all = [
      { title: 'Leave Policy 2026', cat: 'Leave', meta: 'v2 · updated 2 Jan' },
      { title: 'Code of Conduct', cat: 'Conduct', meta: 'v4 · updated 15 Mar' },
      { title: 'POSH Policy', cat: 'Conduct', meta: 'v2 · updated 10 Feb' },
      { title: 'Travel & Expenses', cat: 'Money', meta: 'v1 · updated 22 Jul' },
      { title: 'IT & Acceptable Use', cat: 'Work', meta: 'v2 · updated 5 May' },
      { title: 'Holiday List 2026', cat: 'Leave', meta: 'v1 · updated 20 Dec' }
    ];
    const cats = ['All', 'Leave', 'Work', 'Conduct', 'Money'];
    return {
      cats: cats.map((c) => {
        const on = c === this.state.cat;
        return {
          label: c, pressed: on ? 'true' : 'false',
          style: 'height: 38px; padding: 0 16px; border-radius: 999px; border: 0; font: inherit; font-size: 13px; white-space: nowrap; ' + (on ? 'background: #2A2A2A; color: #FFFFFF; font-weight: 800;' : 'background: #FFFFFF; color: #2A2A2A; font-weight: 700;'),
          pick: () => this.setState({ cat: c })
        };
      }),
      items: all.filter((p) => this.state.cat === 'All' || p.cat === this.state.cat).map((p) => ({
        ...p,
        icon: 'width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: ' + tone[p.cat][0] + '; color: ' + tone[p.cat][1] + ';'
      }))
    };
  }
}
</script>
</body>
</html>
