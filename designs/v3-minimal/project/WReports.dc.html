<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'leave' };
  }
  renderVals() {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];
    const reports = [
      { id: 'leave', name: 'Leave summary', desc: 'Days taken by month', chart: 'Leave days taken per month', data: [38, 31, 45, 52, 61, 40, 34, 47, 42], stats: [['Days taken', '390'], ['Per person', '8.1'], ['Peak month', 'May']] },
      { id: 'att', name: 'Attendance', desc: 'Office vs WFH, late check-ins', chart: 'Average people in office per day', data: [24, 25, 27, 26, 22, 25, 28, 29, 30], stats: [['Office days', '61%'], ['Late check-ins', '42'], ['Flagged', '7']] },
      { id: 'food', name: 'Cafeteria', desc: 'Meals booked and wasted', chart: 'Meals served per month', data: [410, 395, 452, 470, 430, 455, 498, 512, 530], stats: [['Meals', '4,152'], ['Veg share', '63%'], ['No-shows', '2.1%']] },
      { id: 'proj', name: 'Project utilization', desc: 'Allocation across projects', chart: 'Billable utilization %', data: [74, 76, 79, 81, 78, 80, 83, 84, 82], stats: [['Average', '80%'], ['Over 100%', '1 person'], ['Bench', '4 people']] },
      { id: 'lop', name: 'Loss of pay', desc: 'For payroll each month', chart: 'Unpaid days per month', data: [3, 1, 4, 2, 0, 5, 2, 1, 2.5], stats: [['Total days', '20.5'], ['People', '9'], ['This month', '2.5']] },
      { id: 'acks', name: 'Policy acknowledgements', desc: 'Who read what', chart: 'Acknowledgement rate %', data: [100, 100, 98, 98, 100, 96, 100, 100, 77], stats: [['WFH v3', '77%'], ['Overdue', '0'], ['Open', '11']] },
      { id: 'audit', name: 'Audit log', desc: 'Every change, who and when', chart: 'Changes logged per month', data: [210, 185, 240, 260, 230, 250, 275, 290, 305], stats: [['Events', '2,245'], ['Access denied', '38'], ['MFA reveals', '14']] }
    ];
    const cur = reports.find((r) => r.id === this.state.sel);
    const max = Math.max(...cur.data);
    return {
      reports: reports.map((r) => ({
        ...r, sel: r.id === this.state.sel ? 'true' : 'false', pick: () => this.setState({ sel: r.id }),
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; border-radius: 16px; font: inherit; text-align: left; cursor: pointer; ' + (r.id === this.state.sel ? 'background: #2A2A2A; color: #FFFFFF; border: 1px solid #2A2A2A;' : 'background: #FFFFFF; color: #2A2A2A; border: 1px solid #EDEDED;')
      })),
      cur: { ...cur, stats: cur.stats.map(([label, value]) => ({ label, value })) },
      bars: cur.data.map((v, i) => ({
        m: months[i], v,
        style: 'width: 100%; max-width: 44px; border-radius: 6px 6px 0 0; height: ' + Math.max(Math.round((v / max) * 180), 2) + 'px; background: ' + (v === max ? '#A32330' : '#2A2A2A') + ';'
      }))
    };
  }
}
</script>
