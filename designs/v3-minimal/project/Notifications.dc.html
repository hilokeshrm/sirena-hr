<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A32330}a:hover{color:#A32330}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2A2A2A; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; padding: 22px 16px 10px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2A2A2A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; flex: 1">What’s new</h1>
    <button type="button" onClick="{{readAll}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; color: #A32330">Clear all</button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 4px 20px 20px; overflow: hidden">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <h2 style="margin: 8px 0 2px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800; color: #2A2A2A">{{g.label}}</h2>
      <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
        <a href="{{n.href}}" onClick="{{n.read}}" style="{{n.cardStyle}}">
          <span style="{{n.iconStyle}}">{{n.tag}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 14px; font-weight: 700; line-height: 1.35">{{n.title}}</span>
            <span style="font-size: 12px; color: #2A2A2A; font-weight: 600">{{n.time}}</span>
          </span>
          <span style="{{n.dot}}" aria-label="{{n.unreadLabel}}"></span>
        </a>
      </sc-for>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { read: {} };
  }
  renderVals() {
    const kinds = {
      leave: { bg: '#EDEDED', fg: '#A32330', tag: 'LV' },
      policy: { bg: '#EDEDED', fg: '#2A2A2A', tag: 'PO' },
      food: { bg: '#EDEDED', fg: '#2A2A2A', tag: 'FD' },
      task: { bg: '#EDEDED', fg: '#2A2A2A', tag: 'TK' },
      hr: { bg: '#EDEDED', fg: '#A32330', tag: 'HR' }
    };
    const data = [
      { label: 'Today', items: [
        { id: 1, k: 'leave', title: 'Karthik S asked for 1 day off on Fri 9 Oct', time: '10:02', href: 'Approvals.dc.html', unread: true },
        { id: 2, k: 'food', title: 'Your veg lunch is locked in. Pass A-142', time: '10:30', href: 'FoodBooking.dc.html', unread: true },
        { id: 3, k: 'task', title: 'Sneha assigned you “Wi-Fi check-in endpoint”', time: '09:58', href: 'Projects.dc.html', unread: true },
        { id: 4, k: 'policy', title: 'WFH Policy v3 is out. Please give it a read.', time: '09:30', href: 'PolicyDetail.dc.html', unread: false }
      ] },
      { label: 'Earlier', items: [
        { id: 5, k: 'hr', title: 'Your ID proof expires 30 Nov. Upload a fresh copy.', time: 'Fri, 2 Oct', href: 'Profile.dc.html', unread: false },
        { id: 6, k: 'leave', title: 'Monthly credit: +1 CL, +1.5 EL', time: 'Thu, 1 Oct', href: 'Leave.dc.html', unread: false }
      ] }
    ];
    const rd = this.state.read;
    return {
      readAll: () => {
        const all = {};
        data.forEach((g) => g.items.forEach((n) => { all[n.id] = true; }));
        this.setState({ read: all });
      },
      groups: data.map((g) => ({
        label: g.label,
        items: g.items.map((n) => {
          const k = kinds[n.k];
          const unread = n.unread && !rd[n.id];
          return {
            ...n,
            tag: k.tag,
            unreadLabel: unread ? 'Unread' : 'Read',
            read: () => this.setState({ read: { ...rd, [n.id]: true } }),
            cardStyle: 'display: flex; align-items: center; gap: 12px; border-radius: 20px; padding: 12px 14px; text-decoration: none; color: #2A2A2A; ' + (unread ? 'background: #FFFFFF; box-shadow: 0 6px 18px rgba(42,42,42,0.08);' : 'background: rgba(255,255,255,0.55);'),
            iconStyle: 'width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; background: ' + k.bg + '; color: ' + k.fg + ';',
            dot: 'width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: ' + (unread ? '#A32330' : 'transparent') + ';'
          };
        })
      }))
    };
  }
}
</script>
</body>
</html>
