<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A32330}a:hover{color:#A32330}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2A2A2A; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; padding: 22px 16px 10px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2A2A2A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; flex: 1">My projects</h1>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 100px; overflow: hidden">
    <div role="tablist" aria-label="Project" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{p.sel}}" onClick="{{p.pick}}" style="{{p.style}}">
          <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.5px; opacity: 0.85">{{p.client}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; line-height: 1.1; text-align: left">{{p.name}}</span>
          <span style="display: flex; align-items: center; gap: 6px; width: 100%">
            <span style="flex: 1; height: 6px; border-radius: 3px; background: rgba(42,42,42,0.15)"><span style="{{p.bar}}"></span></span>
            <span style="font-size: 11px; font-weight: 800">{{p.pct}}%</span>
          </span>
        </button>
      </sc-for>
    </div>

    <div role="tablist" aria-label="Section" style="display: flex; gap: 4px; background: #EDEDED; border-radius: 999px; padding: 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isTasks}}" hint-placeholder-val="{{ true }}">
      <section aria-label="Tasks" style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">My tasks · {{doneCount}}/{{taskCount}} done</h2>
          <span style="font-size: 12px; font-weight: 700; color: #2A2A2A">Sprint 14</span>
        </div>
        <sc-for list="{{tasks}}" as="t" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #EDEDED; border-radius: 18px; padding: 10px 12px">
            <button type="button" onClick="{{t.toggle}}" aria-label="{{t.aria}}" style="{{t.check}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="{{t.titleStyle}}">{{t.title}}</span>
              <span style="display: flex; gap: 6px; align-items: center; font-size: 11px; color: #2A2A2A; font-weight: 700"><span style="{{t.prio}}">{{t.priority}}</span>{{t.due}}</span>
            </span>
            <span style="{{t.stChip}}">{{t.status}}</span>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <sc-if value="{{isFiles}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Files" style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">Files</h2>
          <button type="button" style="display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #2A2A2A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 8.5l5-5 5 5M5 20h14"></path></svg>Upload</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <div style="background: #EDEDED; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="font-size: 13px; font-weight: 800">Designs</span><span style="font-size: 11px; font-weight: 600">18 files</span></div>
          <div style="background: #EDEDED; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="font-size: 13px; font-weight: 800">Client docs</span><span style="font-size: 11px; font-weight: 600">7 files · leads only</span></div>
        </div>
        <sc-for list="{{files}}" as="f" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #EDEDED; border-radius: 18px; padding: 10px 12px">
            <span style="{{f.badge}}">{{f.ext}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.name}}</span><span style="font-size: 11px; color: #2A2A2A; font-weight: 600">{{f.meta}}</span></span>
            <button type="button" aria-label="Download" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: #EDEDED; display: flex; align-items: center; justify-content: center; color: #2A2A2A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"></path></svg></button>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <sc-if value="{{isTeam}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Team" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">Team · {{teamCount}} people</h2>
        <sc-for list="{{team}}" as="m" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #EDEDED; border-radius: 18px; padding: 8px 12px 8px 8px">
            <span style="{{m.avatar}}">{{m.initials}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">{{m.name}}</span><span style="font-size: 12px; color: #2A2A2A">{{m.role}}</span></span>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800">{{m.alloc}}</span>
          </div>
        </sc-for>
      </section>
    </sc-if>
  </main>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; height: 68px; background: #2A2A2A; border-radius: 26px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; box-shadow: 0 12px 30px rgba(42,42,42,0.30)">
    <a href="Main.dc.html" aria-label="Home" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #EDEDED">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="Leave.dc.html" aria-label="Leave" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #EDEDED">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg></a>
    <a href="Attendance.dc.html" aria-label="Check in" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #EDEDED">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></a>
    <a href="FoodBooking.dc.html" aria-label="Food" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #EDEDED">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1-3 3.5-3 7h3v11"></path></svg></a>
    <a href="Projects.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: 999px; background: #EDEDED; color: #2A2A2A; font-size: 13px; font-weight: 800; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"></path></svg>Projects</a>
    <a href="Profile.dc.html" aria-label="Me" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; color: #EDEDED">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { proj: 'atlas', tab: 'tasks', done: { 3: true } };
  }
  renderVals() {
    const { proj, tab, done } = this.state;
    const projects = [
      { id: 'atlas', name: 'Atlas Mobile Revamp', client: 'BRIGHTLINE', pct: 45, bg: '#A32330', fg: '#FFFFFF', barc: '#EDEDED' },
      { id: 'hr', name: 'Internal HR Suite', client: 'INTERNAL', pct: 70, bg: '#EDEDED', fg: '#2A2A2A', barc: '#2A2A2A' }
    ];
    const taskData = {
      atlas: [
        { id: 1, title: 'Offline sync for delivery list', priority: 'High', due: 'Due Fri', status: 'In progress' },
        { id: 2, title: 'Fix crash on proof-of-delivery photo', priority: 'Urgent', due: 'Due today', status: 'In review' },
        { id: 3, title: 'Driver login with OTP', priority: 'Med', due: 'Done Mon', status: 'Done' },
        { id: 4, title: 'Push notification for new route', priority: 'Low', due: 'Due 16 Oct', status: 'To do' }
      ],
      hr: [
        { id: 5, title: 'Leave ledger API', priority: 'High', due: 'Due Thu', status: 'In progress' },
        { id: 6, title: 'Wi-Fi check-in endpoint', priority: 'High', due: 'Due 14 Oct', status: 'To do' },
        { id: 7, title: 'Meal booking cut-off job', priority: 'Med', due: 'Due 15 Oct', status: 'To do' }
      ]
    };
    const fileData = {
      atlas: [
        { ext: 'PDF', name: 'Atlas_SOW_v2.pdf', meta: '1.2 MB · Arjun · 2 Oct', c: '#EDEDED', t: '#A32330' },
        { ext: 'FIG', name: 'Driver app flows.fig', meta: '8.4 MB · Rahul · yesterday', c: '#EDEDED', t: '#A32330' },
        { ext: 'XLS', name: 'Sprint 14 estimates.xlsx', meta: '220 KB · Karthik · Mon', c: '#EDEDED', t: '#2A2A2A' },
        { ext: 'DOC', name: 'API contract.docx', meta: '96 KB · Sneha · 28 Sep', c: '#EDEDED', t: '#2A2A2A' }
      ],
      hr: [
        { ext: 'PDF', name: 'HR Suite plan.pdf', meta: '640 KB · Meena · 30 Sep', c: '#EDEDED', t: '#A32330' },
        { ext: 'FIG', name: 'Playful UI kit.fig', meta: '12 MB · Rahul · today', c: '#EDEDED', t: '#A32330' }
      ]
    };
    const teamData = {
      atlas: [['AM', '#EDEDED', 'Arjun Mehta', 'Project lead', '50%'], ['KS', '#EDEDED', 'Karthik S', 'Tech lead', '80%'], ['PR', '#EDEDED', 'Priya Raman', 'Developer', '60%'], ['DN', '#EDEDED', 'Divya Nair', 'QA', '100%'], ['VR', '#EDEDED', 'Vikram Rao', 'Mobile dev', '50%']],
      hr: [['PR', '#EDEDED', 'Priya Raman', 'Project lead', '40%'], ['RV', '#EDEDED', 'Rahul Verma', 'Designer', '60%'], ['SI', '#EDEDED', 'Sneha Iyer', 'Backend', '50%']]
    };
    const prio = { Urgent: '#A32330', High: '#A32330', Med: '#A32330', Low: '#2A2A2A' };
    const stc = { 'To do': 'background: #EDEDED; color: #2A2A2A;', 'In progress': 'background: #EDEDED; color: #2A2A2A;', 'In review': 'background: #EDEDED; color: #A32330;', 'Done': 'background: #2A2A2A; color: #FFFFFF;' };
    const tasks = taskData[proj].map((t) => {
      const isDone = !!done[t.id] || t.status === 'Done' && done[t.id] !== false;
      const status = isDone ? 'Done' : (t.status === 'Done' ? 'To do' : t.status);
      return {
        ...t,
        status,
        aria: isDone ? 'Mark not done' : 'Mark done',
        toggle: () => this.setState({ done: { ...done, [t.id]: !isDone } }),
        check: 'width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; ' + (isDone ? 'background: #2A2A2A; border: 0; color: #FFFFFF;' : 'background: #FFFFFF; border: 2px solid #EDEDED; color: transparent;'),
        titleStyle: 'font-size: 14px; font-weight: 800; ' + (isDone ? 'text-decoration: line-through; color: #2A2A2A;' : ''),
        prio: 'font-weight: 800; color: ' + prio[t.priority] + ';',
        stChip: 'font-size: 11px; font-weight: 800; padding: 5px 9px; border-radius: 999px; white-space: nowrap; ' + stc[status],
        isDone
      };
    });
    return {
      projects: projects.map((p) => ({
        ...p,
        sel: p.id === proj ? 'true' : 'false',
        pick: () => this.setState({ proj: p.id }),
        bar: 'display: block; height: 6px; border-radius: 3px; width: ' + p.pct + '%; background: ' + p.barc + ';',
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 22px; font: inherit; cursor: pointer; border: 0; text-align: left; background: ' + p.bg + '; color: ' + p.fg + '; ' + (p.id === proj ? 'box-shadow: 0 0 0 3px #2A2A2A;' : 'opacity: 0.7;')
      })),
      tabs: [['tasks', 'Tasks'], ['files', 'Files'], ['team', 'Team']].map(([id, label]) => ({
        label, sel: tab === id ? 'true' : 'false', pick: () => this.setState({ tab: id }),
        style: 'flex: 1; height: 38px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; ' + (tab === id ? 'background: #2A2A2A; color: #FFFFFF; font-weight: 800;' : 'background: transparent; color: #2A2A2A; font-weight: 700;')
      })),
      isTasks: tab === 'tasks', isFiles: tab === 'files', isTeam: tab === 'team',
      tasks,
      taskCount: tasks.length,
      doneCount: tasks.filter((t) => t.isDone).length,
      files: fileData[proj].map((f) => ({ ...f, badge: 'width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; background: ' + f.c + '; color: ' + f.t + ';' })),
      team: teamData[proj].map((m) => ({ initials: m[0], name: m[2], role: m[3], alloc: m[4], avatar: 'width: 42px; height: 42px; border-radius: 14px; background: ' + m[1] + '; color: #2A2A2A; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0;' })),
      teamCount: teamData[proj].length
    };
  }
}
</script>
</body>
</html>
